<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Toko — UsahaKita</title>
  <meta name="description" content="Lihat daftar produk dan pesan langsung melalui WhatsApp." />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <style>
    .toko-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }
    .toko-hero {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .toko-brand {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      flex: 1;
      min-width: 240px;
    }
    .toko-logo {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: var(--orange-soft);
      color: var(--orange-dark);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      overflow: hidden;
      flex-shrink: 0;
    }
    .toko-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 14px;
    }
    .toko-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-align: left;
      padding: 0;
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .toko-card:hover {
      transform: translateY(-2px);
      border-color: #d6dae6;
    }
    .toko-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f3f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      overflow: hidden;
    }
    .toko-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .toko-card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .toko-desc-clamp {
      font-size: 11.5px;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
    .skel {
      background: linear-gradient(90deg, #eceef3 25%, #f5f6f9 50%, #eceef3 75%);
      background-size: 200% 100%;
      animation: skelPulse 1.1s infinite linear;
      border-radius: 12px;
    }
    @keyframes skelPulse {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
    .toko-footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    @media (max-width: 480px) {
      .toko-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .toko-card-body { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="toko-wrap" id="toko-root">
    <div class="skel" style="height:120px;margin-bottom:16px"></div>
    <div class="toko-grid">
      <div class="skel" style="height:240px"></div>
      <div class="skel" style="height:240px"></div>
      <div class="skel" style="height:240px"></div>
      <div class="skel" style="height:240px"></div>
    </div>
  </div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/db.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get('u') || '';
      var root = document.getElementById('toko-root');

      var state = {
        search: '',
        catId: 'semua',
        sort: 'terbaru'
      };

      function isStoreOpenNow(tenant) {
        var now = new Date();
        var hari = UKUtils.hariIndo(now);
        var hrs = tenant.jamOperasional && tenant.jamOperasional[hari];
        if (!hrs) return { open: true, text: 'Buka' };
        if (!hrs.buka) return { open: false, text: 'Tutup hari ini (' + hari + ')' };
        var hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        var isOpen = hhmm >= (hrs.jamBuka || '00:00') && hhmm <= (hrs.jamTutup || '23:59');
        return {
          open: isOpen,
          text: (isOpen ? 'Buka' : 'Tutup') + ' · ' + hari + ' ' + hrs.jamBuka + '–' + hrs.jamTutup
        };
      }

      function openProductDetail(data, prod) {
        var tenant = data.tenant;
        var settings = data.settings;
        var cats = data.categories;
        var catObj = cats.find(function (c) { return c.id === prod.kategoriId; });
        var variants = Array.isArray(prod.varian) ? prod.varian : [];
        var selectedVarIdx = variants.length ? 0 : -1;
        var qty = 1;
        var maxStok = Number(prod.stok) || 0;
        var outOfStock = maxStok <= 0;

        var modalId = 'uk-toko-detail-modal';
        var imgHTML = prod.foto
          ? '<img src="' + UKUtils.escapeHTML(prod.foto) + '" alt="' + UKUtils.escapeHTML(prod.nama) + '" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px" />'
          : '<div style="width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:64px">' + UKUtils.escapeHTML(prod.emoji || '📦') + '</div>';

        var varHTML = variants.length ? (
          '<div style="margin-bottom:12px">' +
            '<div style="font-size:12px;font-weight:600;margin-bottom:6px">Pilih Varian</div>' +
            '<div class="chips">' +
              variants.map(function (v, idx) {
                return '<button type="button" class="chip toko-var-chip ' + (idx === 0 ? 'active' : '') + '" data-vidx="' + idx + '">' + UKUtils.escapeHTML(v.nama) + (Number(v.hargaTambahan) > 0 ? ' (+' + UKUtils.escapeHTML(UKUtils.rupiah(v.hargaTambahan)) + ')' : '') + '</button>';
              }).join('') +
            '</div>' +
          '</div>'
        ) : '';

        var el = UKUtils.openModal({
          id: modalId,
          size: 'lg',
          title: prod.nama,
          bodyHTML:
            '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;align-items:start">' +
              '<div>' + imgHTML + '</div>' +
              '<div>' +
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">' +
                  '<span style="font-size:12px;color:var(--muted)">' + UKUtils.escapeHTML(catObj ? catObj.nama : 'Umum') + '</span>' +
                  '<span class="status ' + (outOfStock ? 'danger' : 'success') + '">' + (outOfStock ? 'Habis' : 'Tersedia (' + maxStok + ')') + '</span>' +
                '</div>' +
                '<div id="toko-det-price" style="font-size:22px;font-weight:800;color:var(--orange-dark);margin-bottom:10px" class="tabular-nums"></div>' +
                '<p style="margin:0 0 14px;font-size:13px;color:var(--ink);line-height:1.6">' + UKUtils.escapeHTML(prod.deskripsi || 'Tidak ada deskripsi tambahan.') + '</p>' +
                varHTML +
                '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
                  '<span style="font-size:12.5px;font-weight:600">Jumlah:</span>' +
                  '<div style="display:flex;align-items:center;gap:4px">' +
                    '<button type="button" class="btn btn-light btn-sm" id="toko-qty-dec"' + (outOfStock ? ' disabled' : '') + '>−</button>' +
                    '<input type="number" id="toko-qty-inp" class="uk-input tabular-nums" value="' + (outOfStock ? 0 : 1) + '" min="' + (outOfStock ? 0 : 1) + '" max="' + maxStok + '" style="width:56px;text-align:center;padding:5px"' + (outOfStock ? ' disabled' : '') + ' />' +
                    '<button type="button" class="btn btn-light btn-sm" id="toko-qty-inc"' + (outOfStock ? ' disabled' : '') + '>+</button>' +
                  '</div>' +
                '</div>' +
                '<button type="button" class="btn btn-primary" id="toko-btn-wa-order" style="width:100%"' + (outOfStock ? ' disabled' : '') + '>' + (outOfStock ? 'Stok Habis' : 'Pesan via WhatsApp') + '</button>' +
              '</div>' +
            '</div>'
        });

        function currentUnitPrice() {
          var add = (selectedVarIdx >= 0 && variants[selectedVarIdx]) ? (Number(variants[selectedVarIdx].hargaTambahan) || 0) : 0;
          return (Number(prod.hargaJual) || 0) + add;
        }
        function refreshPrice() {
          el.querySelector('#toko-det-price').textContent = UKUtils.rupiah(currentUnitPrice());
        }
        refreshPrice();

        el.querySelectorAll('.toko-var-chip').forEach(function (chip) {
          chip.addEventListener('click', function () {
            selectedVarIdx = Number(chip.getAttribute('data-vidx'));
            el.querySelectorAll('.toko-var-chip').forEach(function (c) { c.classList.remove('active'); });
            chip.classList.add('active');
            refreshPrice();
          });
        });

        var qInp = el.querySelector('#toko-qty-inp');
        if (!outOfStock) {
          el.querySelector('#toko-qty-dec').addEventListener('click', function () {
            qty = Math.max(1, qty - 1);
            qInp.value = qty;
          });
          el.querySelector('#toko-qty-inc').addEventListener('click', function () {
            qty = Math.min(maxStok, qty + 1);
            qInp.value = qty;
          });
          qInp.addEventListener('change', function () {
            qty = Math.max(1, Math.min(maxStok, Math.floor(Number(qInp.value) || 1)));
            qInp.value = qty;
          });
          el.querySelector('#toko-btn-wa-order').addEventListener('click', function () {
            var varLabel = (selectedVarIdx >= 0 && variants[selectedVarIdx]) ? (' (' + variants[selectedVarIdx].nama + ')') : '';
            var prodLabel = prod.nama + varLabel;
            var priceStr = UKUtils.rupiah(currentUnitPrice());
            var linkToko = window.location.href;
            var tmpl = (settings && settings.pesanWADefault) ||
              'Halo, saya tertarik memesan produk berikut:\n\nNama Produk: {produk}\nHarga: {harga}\nJumlah: {jumlah}\nTautan: {tautan}\n\nApakah produk ini masih tersedia?';
            var msg = tmpl
              .replace(/\{produk\}/g, prodLabel)
              .replace(/\{harga\}/g, priceStr)
              .replace(/\{jumlah\}/g, String(qty))
              .replace(/\{tautan\}/g, linkToko);

            db.tenants.incrementWaClick(tenant.id);
            var url = UKUtils.buatLinkWA(tenant.wa, msg);
            var a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.click();
          });
        }
      }

      function renderCatalog() {
        var data = slug ? db.publicCatalog(slug) : null;
        if (!data) {
          document.title = 'Katalog tidak tersedia — UsahaKita';
          root.innerHTML =
            '<div class="empty-note" style="max-width:480px;margin:60px auto;padding:40px 24px">' +
              '<div style="font-size:36px">🏪</div>' +
              '<h1 style="font-size:20px;margin:10px 0 6px;color:var(--ink)">Katalog tidak tersedia</h1>' +
              '<p>Tautan toko yang Anda buka tidak ditemukan, sedang dinonaktifkan oleh pemilik usaha, atau akun ditangguhkan.</p>' +
              '<a href="../index.html" class="btn btn-primary">Kembali ke UsahaKita</a>' +
            '</div>';
          return;
        }

        var tenant = data.tenant;
        var cats = data.categories;
        var prods = data.products;

        document.title = tenant.nama + ' — Katalog Produk UsahaKita';
        var metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', tenant.deskripsi || ('Katalog online resmi ' + tenant.nama));

        var openStatus = isStoreOpenNow(tenant);
        var q = state.search.trim().toLowerCase();
        var filtered = prods.filter(function (p) {
          if (state.catId !== 'semua' && p.kategoriId !== state.catId) return false;
          if (q && (p.nama + ' ' + (p.deskripsi || '')).toLowerCase().indexOf(q) === -1) return false;
          return true;
        });

        filtered.sort(function (a, b) {
          if (state.sort === 'harga_asc') return a.hargaJual - b.hargaJual;
          if (state.sort === 'harga_desc') return b.hargaJual - a.hargaJual;
          if (state.sort === 'nama_asc') return String(a.nama).localeCompare(String(b.nama), 'id');
          return new Date(b.dibuatPada || 0) - new Date(a.dibuatPada || 0);
        });

        var chipsHTML = '<button type="button" class="chip ' + (state.catId === 'semua' ? 'active' : '') + '" data-cat="semua">Semua</button>' +
          cats.map(function (c) {
            return '<button type="button" class="chip ' + (state.catId === c.id ? 'active' : '') + '" data-cat="' + UKUtils.escapeHTML(c.id) + '">' + UKUtils.escapeHTML(c.nama) + '</button>';
          }).join('');

        var gridHTML = filtered.length ? filtered.map(function (p) {
          var habis = Number(p.stok) <= 0;
          return (
            '<button type="button" class="toko-card" data-pid="' + UKUtils.escapeHTML(p.id) + '">' +
              '<div class="toko-thumb">' +
                (p.foto ? '<img src="' + UKUtils.escapeHTML(p.foto) + '" alt="' + UKUtils.escapeHTML(p.nama) + '" />' : UKUtils.escapeHTML(p.emoji || '📦')) +
              '</div>' +
              '<div class="toko-card-body">' +
                '<div style="font-weight:700;font-size:13.5px;color:var(--ink)">' + UKUtils.escapeHTML(p.nama) + '</div>' +
                '<div class="toko-desc-clamp">' + UKUtils.escapeHTML(p.deskripsi || 'Produk pilihan.') + '</div>' +
                '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto;padding-top:6px">' +
                  '<strong class="tabular-nums" style="color:var(--orange-dark);font-size:13.5px">' + UKUtils.escapeHTML(UKUtils.rupiah(p.hargaJual)) + '</strong>' +
                  '<span class="status ' + (habis ? 'danger' : 'success') + '">' + (habis ? 'Habis' : 'Tersedia') + '</span>' +
                '</div>' +
              '</div>' +
            '</button>'
          );
        }).join('') : '<div class="empty-note" style="grid-column:1/-1"><h4>Produk tidak ditemukan</h4><p>Coba kata kunci atau kategori lain.</p></div>';

        var directWAMsg = 'Halo ' + tenant.nama + ', saya ingin bertanya mengenai produk di katalog Anda.';
        root.innerHTML =
          '<header class="toko-hero">' +
            '<div class="toko-brand">' +
              '<div class="toko-logo">' +
                (tenant.logo ? '<img src="' + UKUtils.escapeHTML(tenant.logo) + '" alt="Logo" style="width:100%;height:100%;object-fit:cover" />' : UKUtils.escapeHTML(String(tenant.nama).charAt(0).toUpperCase())) +
              '</div>' +
              '<div>' +
                '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
                  '<h1 style="margin:0;font-size:20px">' + UKUtils.escapeHTML(tenant.nama) + '</h1>' +
                  '<span class="status ' + (openStatus.open ? 'success' : 'danger') + '">' + UKUtils.escapeHTML(openStatus.text) + '</span>' +
                '</div>' +
                '<p style="margin:5px 0;font-size:13px;color:var(--muted);max-width:62ch">' + UKUtils.escapeHTML(tenant.deskripsi || '') + '</p>' +
                '<div style="font-size:12px;color:var(--muted)">📍 ' + UKUtils.escapeHTML(tenant.alamat || '-') + '</div>' +
              '</div>' +
            '</div>' +
            '<a href="' + UKUtils.escapeHTML(UKUtils.buatLinkWA(tenant.wa, directWAMsg)) + '" target="_blank" rel="noopener" id="toko-header-wa" class="btn btn-primary">Chat WhatsApp</a>' +
          '</header>' +

          '<section class="panel" style="margin-bottom:18px">' +
            '<div class="toolbar">' +
              '<div class="toolbar-group" style="flex:1">' +
                '<input type="search" id="toko-search" class="uk-input" placeholder="Cari produk..." value="' + UKUtils.escapeHTML(state.search) + '" style="max-width:260px" />' +
              '</div>' +
              '<select id="toko-sort" class="uk-select" style="width:auto">' +
                '<option value="terbaru"' + (state.sort === 'terbaru' ? ' selected' : '') + '>Terbaru</option>' +
                '<option value="harga_asc"' + (state.sort === 'harga_asc' ? ' selected' : '') + '>Harga Terendah</option>' +
                '<option value="harga_desc"' + (state.sort === 'harga_desc' ? ' selected' : '') + '>Harga Tertinggi</option>' +
                '<option value="nama_asc"' + (state.sort === 'nama_asc' ? ' selected' : '') + '>Nama A–Z</option>' +
              '</select>' +
            '</div>' +
            '<div class="chips" style="margin-bottom:14px">' + chipsHTML + '</div>' +
            '<div class="toko-grid">' + gridHTML + '</div>' +
          '</section>' +

          '<section class="panel" style="max-width:620px">' +
            '<h2 class="panel-title" style="margin-bottom:4px">Tanya Penjual</h2>' +
            '<p class="panel-sub" style="margin-bottom:12px">Kirim pertanyaan langsung ke pemilik usaha (akan masuk ke kotak Pesan Pelanggan).</p>' +
            '<form id="toko-ask-form">' +
              '<div class="form-grid-2">' +
                '<div class="field"><label for="ask-nama">Nama Anda *</label><input type="text" id="ask-nama" placeholder="Contoh: Andi" required /></div>' +
                '<div class="field"><label for="ask-wa">No. WhatsApp (opsional)</label><input type="tel" id="ask-wa" placeholder="0812..." /></div>' +
              '</div>' +
              '<div class="field"><label for="ask-pesan">Pertanyaan *</label><textarea id="ask-pesan" rows="2" placeholder="Tanyakan stok, pengiriman, atau pesanan khusus..." required></textarea></div>' +
              '<button type="submit" class="btn btn-primary">Kirim Pesan</button>' +
            '</form>' +
          '</section>' +

          '<footer class="toko-footer">Dibuat dengan <a href="../index.html" style="color:var(--orange-dark);font-weight:700">UsahaKita</a></footer>';

        root.querySelector('#toko-header-wa').addEventListener('click', function () {
          db.tenants.incrementWaClick(tenant.id);
        });

        var sInp = root.querySelector('#toko-search');
        sInp.addEventListener('input', UKUtils.debounce(function () {
          state.search = sInp.value;
          renderCatalog();
          var n = document.getElementById('toko-search');
          if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
        }, 220));

        root.querySelector('#toko-sort').addEventListener('change', function () {
          state.sort = this.value;
          renderCatalog();
        });

        root.querySelectorAll('[data-cat]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.catId = btn.getAttribute('data-cat');
            renderCatalog();
          });
        });

        root.querySelectorAll('.toko-card').forEach(function (card) {
          card.addEventListener('click', function () {
            var pid = card.getAttribute('data-pid');
            var prod = prods.find(function (p) { return p.id === pid; });
            if (prod) openProductDetail(data, prod);
          });
        });

        root.querySelector('#toko-ask-form').addEventListener('submit', function (e) {
          e.preventDefault();
          var nama = UKUtils.cleanSpaces(root.querySelector('#ask-nama').value);
          var wa = UKUtils.normalisasiWA(root.querySelector('#ask-wa').value);
          var pesan = UKUtils.cleanSpaces(root.querySelector('#ask-pesan').value);
          if (!nama || !pesan) {
            UKUtils.toast('Nama dan pertanyaan wajib diisi.', 'error');
            return;
          }

          var convs = db.conversations.list({ tenantId: tenant.id });
          var existing = convs.find(function (c) {
            return c.kanal === 'Website' && c.nama.toLowerCase() === nama.toLowerCase();
          });
          var msgObj = { dari: 'pelanggan', teks: pesan, waktu: new Date().toISOString() };
          if (existing) {
            var nextMsgs = (existing.messages || []).slice();
            nextMsgs.push(msgObj);
            db.conversations.update(existing.id, {
              messages: nextMsgs,
              telepon: wa || existing.telepon || '',
              unread: (Number(existing.unread) || 0) + 1
            }, tenant.id);
          } else {
            db.conversations.create({
              tenantId: tenant.id,
              nama: nama,
              telepon: wa,
              kanal: 'Website',
              unread: 1,
              catatan: 'Masuk dari form Tanya Penjual di katalog publik',
              messages: [msgObj]
            });
          }

          root.querySelector('#toko-ask-form').reset();
          UKUtils.toast('Pesan Anda terkirim ke penjual!', 'success');
        });
      }

      setTimeout(renderCatalog, 160);
    })();
  </script>
</body>
</html>
